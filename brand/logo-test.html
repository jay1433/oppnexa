<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#F6F8FC;font-family:system-ui;display:flex;flex-wrap:wrap;gap:30px;padding:40px}
.cell{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:20px;text-align:center}
.cap{font-size:12px;color:#64748b;margin-top:8px}
.grid{background-image:linear-gradient(#eef2f8 1px,transparent 1px),linear-gradient(90deg,#eef2f8 1px,transparent 1px);background-size:10px 10px}
</style></head><body>

<!-- V1: open ring + bridging link, gap upper-right -->
<div class="cell"><svg width="160" height="160" viewBox="0 0 100 100" class="grid">
  <g transform="rotate(-25 50 50)">
    <circle cx="50" cy="50" r="33" fill="none" stroke="#0A2540" stroke-width="9" stroke-linecap="round" stroke-dasharray="169.9 37.4"/>
  </g>
  <line x1="62" y1="29" x2="82" y2="19" stroke="#0A2540" stroke-width="9" stroke-linecap="round"/>
  <circle cx="62" cy="29" r="8.5" fill="#0A2540"/>
  <circle cx="82" cy="19" r="10" fill="#2F6BFF"/>
</svg><div class="cap">V1 open ring + rising link</div></div>

<!-- V2: node sits IN the gap completing ring -->
<div class="cell"><svg width="160" height="160" viewBox="0 0 100 100" class="grid">
  <g transform="rotate(-25 50 50)">
    <circle cx="50" cy="50" r="33" fill="none" stroke="#0A2540" stroke-width="9" stroke-linecap="round" stroke-dasharray="159 48.3"/>
  </g>
  <circle cx="74" cy="26" r="10.5" fill="#2F6BFF"/>
</svg><div class="cap">V2 open ring + single accent node</div></div>

<!-- V3: two interlocking nodes forming link, no full ring -->
<div class="cell"><svg width="160" height="160" viewBox="0 0 100 100" class="grid">
  <path d="M50 50 m-26 0 a26 26 0 1 1 20 25" fill="none" stroke="#0A2540" stroke-width="9" stroke-linecap="round"/>
  <line x1="44" y1="75" x2="66" y2="53" stroke="#0A2540" stroke-width="9" stroke-linecap="round"/>
  <circle cx="44" cy="75" r="8.5" fill="#0A2540"/>
  <circle cx="68" cy="51" r="10" fill="#2F6BFF"/>
</svg><div class="cap">V3 spiral link</div></div>

<!-- V4: monogram O with inner rising connector (short, offset so not a slash) -->
<div class="cell"><svg width="160" height="160" viewBox="0 0 100 100" class="grid">
  <circle cx="50" cy="50" r="33" fill="none" stroke="#0A2540" stroke-width="9"/>
  <line x1="40" y1="60" x2="60" y2="40" stroke="#2F6BFF" stroke-width="9" stroke-linecap="round"/>
  <circle cx="40" cy="60" r="7" fill="#0A2540"/>
  <circle cx="60" cy="40" r="8" fill="#2F6BFF"/>
</svg><div class="cap">V4 O + inner node link</div></div>

</body></html>
